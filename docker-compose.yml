services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assist_ai}
      POSTGRES_USER: ${POSTGRES_USER:-assist_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assist_ai_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-assist_ai}:${POSTGRES_PASSWORD:-assist_ai_password}@postgres:5432/${POSTGRES_DB:-assist_ai}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost}
      TTS_CACHE_DIR: /app/media/tts-cache
    volumes:
      - backend_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
