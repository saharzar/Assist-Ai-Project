services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: assist_ai
      POSTGRES_USER: assist_ai
      POSTGRES_PASSWORD: assist_ai_password
    ports:
      - "5432:5432"
    volumes:
      - assist_ai_postgres_data:/var/lib/postgresql/data

volumes:
  assist_ai_postgres_data:
